<!DOCTYPE html>
<html>
	<head>
		<style>

  </style>
	</head>
	<body>
        <h2>AVL Tree Animation (BST + Manual Rotation)</h2>
		<!-- Framed container -->
		<div id="output-frame">
			<svg id="visual-area" viewBox="-100 25 800 450" preserveAspectRatio="xMidYMid meet"
				xmlns="http://www.w3.org/2000/svg">
			</svg>
		</div>
		<!-- Controls -->
		<div id="controls">
            <button onclick="insertNode()">Insert</button>
            <button onclick="deleteNode()">Delete</button>
            <button onclick="getTraversal('preorder')">Preorder</button>
            <button onclick="getTraversal('inorder')">Inorder</button>
            <button onclick="getTraversal('postorder')">Postrder</button>
            <button id="rotateBtn">Rotate</button>
            <button id="resetBtn" onclick="loadOrResetTree('/reset','POST')">Reset Tree</button>

            
	    </div>
        <div id="input-area">
		    <!-- Inline input area -->
            <input type="number" id="inputValue"  placeholder="Enter value">
        </div>
	    <!-- Load libraries -->
	   <script src="https://d3js.org/d3.v7.min.js"></script>
<script>

   // Global SVG reference
   const svg = d3.select("#visual-area"); 
   const r = 15; // node radius
   let selectedKey = null;

    // Create status message element once for page setup 
   svg.append("text")
      .attr("class", "status-message")
      .attr("x", 300)
      .attr("y", 415)
      .attr("text-anchor", "middle")
      .attr("fill", "green")
      .attr("font-family", "Courier New")
      .attr("font-size", "18px")
      .attr("font-weight", "bold")
      .style("opacity", 0);

    // Define arrowhead marker once (outside update)
    svg.append("defs").append("marker")
      .attr("id", "arrow")
      .attr("viewBox", "0 -5 10 10")
      .attr("refX", 10)   // push arrow tip outside circle
      .attr("refY", 0)
      .attr("markerWidth", 6)
      .attr("markerHeight", 6)
      .attr("orient", "auto")
      .append("path")
      .attr("d", "M0,-5L10,0L0,5")
      .attr("fill", "black")
      .attr("stroke", "black");

    // Create the placeholder once on page setup
    const emptyPlaceholder = svg.append("text")
      .attr("class", "empty-placeholder")
      .attr("x", 300)
      .attr("y", 200)
      .attr("text-anchor", "middle")
      .attr("fill", "gray")
      .attr("font-size", "20px")
      .attr("font-family", "Courier New")
      .style("opacity", 0)   // start hidden
      .text("Empty Tree");

    // Create resource box labels and bind to appropriate url
    createResourceBox(svg, [
      { label: "D3.js Homepage", url: "https://d3js.org" },
      { label: "SVG Basics", url: "https://developer.mozilla.org/docs/Web/SVG" },
      { label: "Transitions Guide", url: "https://observablehq.com/@d3/learn-d3-transitions" }
   ]);

    // Create the resource box outside the group <g> in main page
    function createResourceBox(svg, links) {
      // Remove any existing resource box
      svg.selectAll("g.info-box").remove();

      // Create group for the box
      let infoBox = svg.append("g")
        .attr("class", "info-box")
        .attr("transform", "translate(550,30)");

      // Background rectangle
      infoBox.append("rect")
        .attr("width", 225)
        .attr("height", 125)
        .attr("fill", "#f9f9f9")
        .attr("stroke", "black")
        .attr("rx", 10)
        .attr("ry", 10)
        .attr("pointer-events", "none"); // Don’t block clicks

      // Title
      infoBox.append("text")
        .attr("x", 125)
        .attr("y", 25)
        .attr("text-anchor", "middle")
        .attr("font-size", "14px")
        .attr("font-weight", "bold")
        .text("Resources");

      // Add each link
      links.forEach((link, i) => {
        let linkGroup = infoBox.append("a")
          .attr("href", link.url)       // Modern browsers use href
          .attr("target", "_blank");    // Open in new tab

        linkGroup.append("text")
          .attr("x", 10)
          .attr("y", 50 + i * 20)       // Stack links vertically
          .attr("class", "link-text")
          .text(link.label);
      });
    }



let introBoxVisible = true;

function createIntroBox(svg, items) {
  hideEmptyTree();
  //showStatus("", "white"); 

  if (!introBoxVisible) return;

  svg.selectAll("g.intro-box").remove();


  let introBox = svg.append("g")
    .attr("class", "intro-box")
    .attr("transform", "translate(125,150)");

  // Background rectangle
  introBox.append("rect")
    .attr("width", 350)
    .attr("height", 250)
    .attr("fill", "#f9f9f9")
    .attr("stroke", "black")
    .attr("rx", 0)
    .attr("ry", 0);

  // Title
  introBox.append("text")
    .attr("x", 160)
    .attr("y", 25)
    .attr("text-anchor", "middle")
    .attr("font-size", "14px")
    .attr("font-weight", "bold")
    .text("Balancing BST with AVL Rotations");

  // Add each item (description, link, or action)
  items.forEach((item, i) => {
    const yPos = 50 + i * 20;

    if (item.url) {
      // External link
      let textEl = introBox.append("text")
        .attr("x", 10)
        .attr("y", yPos)
        .attr("class", "link-text")
        .style("cursor", "pointer")
        .text(item.label);

      textEl.on("click", () => window.open(item.url, "_blank"));
    } else if (item.action) {
      // Action link
      let textEl = introBox.append("text")
        .attr("x", 10)
        .attr("y", yPos+125)
        .attr("class", "link-text")
        .style("cursor", "pointer")
        .text(item.label);

      textEl.on("click", () => {
        item.action();
        svg.selectAll("g.intro-box").remove();
        introBoxVisible = false;
      });
    } else {
          // Plain description text
         addMultilineText(introBox, 10, yPos, item.label);
     }
  });
}

// --- INITIALIZE ---
createIntroBox(svg, [
  { label: "Supports Insert, Delete, Rotate.\r\n \n Instructions:\r\n  Click on a node selects rotation pivot.\n Click on Rotate performs rotation\n Click on Reset creates a new empty tree.\n Give input then click appropriate\n button for Insertion and Deletion\n " }, // plain description with CRLF
  { label: "Start with a new empty Binary Search Tree", action: () => loadOrResetTree() }
]);

function addMultilineText(parent, x, y, textString) {
  // Split on CRLF or LF
  const lines = textString.split(/\r?\n/);

  const text = parent.append("text")
    .attr("x", x)
    .attr("y", y)
    .attr("font-family", "Courier New")
    .attr("font-size", "14px")
    .attr("fill", "black");

  lines.forEach((line, i) => {
    text.append("tspan")
      .attr("x", x)              // reset x for each line
      .attr("dy", i === 0 ? 0 : "1.2em") // vertical offset
      .text(line);
  });
}




   document.addEventListener("DOMContentLoaded", () => {

     //svg.selectAll("g.intro-box").remove();
     loadOrResetTree("/tree", "GET");

     const rotateBtn = document.getElementById("rotateBtn");
     if (rotateBtn) {
       rotateBtn.addEventListener("click", () => {
         if (!selectedKey) { // No node selected for rotation
           msg = "Please select a pivot for rotation first.";
           showStatus(msg, "red");
           return;

         // Bind variable reset to resetBtn 
         const resetBtn = document.getElementById("resetBtn");
         if (resetBtn) {
           resetBtn.addEventListener("click", () => {
             loadOrResetTree("/reset", "POST");
           });
         }
    }


    // Fetch tree performing rotate operation
    fetch('/rotate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: selectedKey })
         })
         .then(res => res.json())
         .then(data => {
           if (data.error) {

             alert(data.error);

          } else if (data.message) {

             showStatus(data.message, "red");

          } else {
            animateRotation(data.tree);
          }
          });
       });
     }
    });  



    // Define status message function
    function showStatus(message, color="green") {
        const status = svg.select("text.status-message");
        if (status.empty()) {
          console.warn("Status message element not found");
          return;
        }

        status.interrupt()
          .text(message)
          .attr("fill", color)
          .style("opacity", 1)
          .transition().delay(1500).duration(2500)
          .style("opacity", 0);
    }

    // Define toggle function ON for empty message placeholder
    function showEmptyTree() {
        svg.select(".empty-placeholder").style("opacity", 1);
    }


    // Define toggle function OFF for empty message placeholder
    function hideEmptyTree() {
        svg.select(".empty-placeholder").style("opacity", 0);
    }

    // Define function for placing arrow heads on links
    function edgePoint(source, target, r) {
      let dx = target.x - source.x;
      let dy = target.y - source.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      return {
        x: source.x + (dx/dist) * r,
        y: source.y + (dy/dist) * r
      };
    } 

     // Traversal orders fetch + render
    function getTraversal(order) {
      let tt = order
      let t_type = tt.charAt(0).toUpperCase() + tt.slice(1);  

      fetch(`/traverse/${order}`)
        .then(res => res.json())
        .then(labels => {
          console.log("Traversal data:", labels); // should be an array
          if (!Array.isArray(labels)) {
            showStatus("Traversal data is not an array", "red");
            return;
          }
          if (labels.length === 0) {
            // Empty list case
            showStatus("Tree is empty - no traversal list to display", "blue");

           // Clear any existing traversal group
           let traversalGroup = svg.select("g.traversal");
           if (!traversalGroup.empty()) {
             traversalGroup.selectAll("*").remove();
           }

            return;
          }
          renderTraversal(labels, order);
          showStatus(`${t_type} traversal list displayed below`, "blue");
        })
        .catch(err => {
          console.error("Traversal fetch error:", err);
          showStatus("Traversal fetch failed", "red");
        });
    }

    // Render function for traversal of tree 
    function renderTraversal(labels, order="Traversal") {
      let traversalGroup = svg.select("g.traversal");
      if (traversalGroup.empty()) {
        traversalGroup = svg.append("g")
          .attr("class", "traversal")
          .attr("transform", "translate(50,450)");
     }

     // Prefix text
     let prefix = traversalGroup.selectAll("text.traversal-prefix")
       .data([order]);

     prefix.enter().append("text")
       .attr("class", "traversal-prefix")
       .attr("x", -115)
       .attr("y", 5)
       .attr("fill", "black")
       .attr("font-size", "16px")
       .attr("font-weight", "bold")
       .text(d => d.charAt(0).toUpperCase() + d.slice(1) + " list:")
       .merge(prefix)
       .text(d => d.charAt(0).toUpperCase() + d.slice(1) + " list:");

     prefix.exit().remove();

     // Render Traversal nodes
     let items = traversalGroup.selectAll("g.traversal-node")
       .data(labels, (d,i) => i);  // use index as key

     let enter = items.enter().append("g")
       .attr("class", "traversal-node")
       .attr("transform", (d, i) => `translate(${i*50},0)`);

     enter.append("circle")
       .attr("r", 15)
       .attr("fill", "orange");

     enter.append("text")
       .attr("text-anchor", "middle")
       .attr("dy", 5)
       .attr("fill", "black")
       .text(d => d);

     items.transition().duration(500)
       .attr("transform", (d, i) => `translate(${i*50},0)`);

     items.select("text").text(d => d);

     items.exit().remove();
   }



   function selectPivot(d, event) {
       // Reset all nodes to default
       d3.selectAll("circle")
         .attr("fill", "steelblue")
         .attr("stroke", "black")
         .attr("stroke-width", 1);

       d3.selectAll("text.node-label")
         .attr("fill", "white");

       // Highlight clicked node
       d3.select(event.currentTarget)
         .attr("fill", "yellow")
         .attr("stroke", "black")
         .attr("stroke-width", 1);

       // Highlight its label in black
       d3.selectAll("text.node-label")
         .filter(l => l.data.name === d.data.name) // change id to name
         .attr("fill", "black");

       // Save selected key globally
       selectedKey = parseInt(d.data.name);  // d.data.name identifies key

       msg = `You clicked ${d.data.name} for rotation`;
       showStatus(msg, "green");
   }


   // Animate rotation independent of as BST operations. 
   // Possible to apply balancing on a partially or fullly constructed BST 
   function animateRotation(treeData) {
     if (!treeData || treeData.empty) {
        // Clear any existing nodes/labels
        svg.select("g.tree").selectAll("*").remove();
        showStatus("Tree is empty", "blue");
        return;
     }

     // Define a group <g> for tree to prevent it interfering the main page
     let g = svg.select("g.tree");

     let root = d3.hierarchy(treeData); // Define the root
     let treeLayout = d3.tree().size([600, 300]);
     treeLayout(root);

     let nodes = root.descendants();
     let links = root.links();

     let nodeSel = g.selectAll("circle")
        .data(nodes, d => d.data.name);

     nodeSel.enter().append("circle")
          .attr("r", 20)
          .attr("stroke", "black")
          .attr("stroke-width", 2)
        .merge(nodeSel)
          .transition().duration(1000)
          .attr("cx", d => d.x)
          .attr("cy", d => d.y)
          .attr("fill", d => {
            let b = d.data.balance;
            if (b > 1) return "blue";       // left-heavy
            if (b < -1) return "crimson";   // right-heavy
            return "steelblue";             // balanced
          }); 

     nodeSel.exit().remove();

     g.selectAll("text.node-label")
         .attr("fill", "white");

     // Animate labels
     g.selectAll("text.node-label")
        .data(nodes, d => d.data.name)  // change id to name
        .transition().duration(1000)
        .attr("x", d => d.x)
        .attr("y", d => d.y + 5);

     // Balance labels
     let balanceSel = g.selectAll("text.balance-label")
        .data(nodes, d => d.data.name);   // change id to name

     balanceSel.enter().append("text")
        .attr("class", "balance-label")
        .attr("text-anchor", "start")
        .attr("fill", "red")
        .attr("x", d => d.x + r + 5)
        .attr("y", d => d.y + 4)
        .text(d => d.data.balance);

     balanceSel.transition().duration(1000)
        .attr("x", d => d.x + r + 5)
        .attr("y", d => d.y + 4)
        .text(d => d.data.balance);

     balanceSel.exit().remove();

     // Animate links
     let linkSel = g.selectAll("line")
        .data(links, d => d.target.data.name);  // stable keys 

      // ENTER
     linkSel.enter().append("line")
        .attr("stroke", "black")
        .attr("stroke-width", 2)
        .attr("marker-end", "url(#arrow)")
      .merge(linkSel)
        .transition().duration(1000)
        .attr("stroke", "black")       // reset every time
        .attr("stroke-width", 1)       // ensure consistent thickness
        .attr("x1", d => edgePoint(d.source, d.target, r).x)
        .attr("y1", d => edgePoint(d.source, d.target, r).y)
        .attr("x2", d => {
            let dx = d.target.x - d.source.x;
            let dy = d.target.y - d.source.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            return d.target.x - (dx/dist) * r;
         })
        .attr("y2", d => {
            let dx = d.target.x - d.source.x;
            let dy = d.target.y - d.source.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            return d.target.y - (dy/dist) * r;
         });

        // EXIT
     linkSel.exit().remove();
  }


  function render(treeData) {

     // Select or create tree group
     let g = svg.select("g.tree");
     if (g.empty()) {
       g = svg.append("g")
         .attr("class", "tree")
         .attr("transform", "translate(0,50)");
     }

     // Build hierarchy + layout
     let root = d3.hierarchy(treeData);
     let treeLayout = d3.tree().size([600, 300]);
     treeLayout(root);

     let nodes = root.descendants();
     let links = root.links();

     // LINKS
     let link = g.selectAll("line")
       .data(links, d => d.target.data.name);

     link.enter().append("line")
         .attr("stroke", "black")
         .attr("marker-end", "url(#arrow)")
       .merge(link)
         .transition().duration(750)
         .attr("x1", d => edgePoint(d.source, d.target, r).x)
         .attr("y1", d => edgePoint(d.source, d.target, r).y)
         .attr("x2", d => {
           let dx = d.target.x - d.source.x;
           let dy = d.target.y - d.source.y;
           let dist = Math.sqrt(dx*dx + dy*dy);
           return d.target.x - (dx/dist) * r;
         })
         .attr("y2", d => {
           let dx = d.target.x - d.source.x;
           let dy = d.target.y - d.source.y;
           let dist = Math.sqrt(dx*dx + dy*dy);
           return d.target.y - (dy/dist) * r;
         });

     link.exit().transition().duration(500).style("opacity", 0).remove();

     // NODES
     let node = g.selectAll("circle")
        .data(nodes, d => d.data.name);   // use name as key

      node.enter().append("circle")
          .attr("cx", d => d.parent ? d.parent.x : d.x)
          .attr("cy", d => d.parent ? d.parent.y : d.y)
          .attr("r", 0)
          .attr("fill", d => {
            // prefer backend-provided balance, fallback to frontend-computed
            let b = (d.data.balance !== undefined) ? d.data.balance : d.balance;

            if (b > 1) {
              return "blue";       // left-heavy
            } else if (b < -1) {
              return "crimson";    // right-heavy
            } else {
              return "steelblue";  // balanced
            }
          })
          .attr("stroke", "black")
          .attr("stroke-width", 2)
          .on("click", function(event, d) {
             selectPivot(d, event);
          })
        .merge(node)
          .transition().duration(750)
          .attr("cx", d => d.x)
          .attr("cy", d => d.y)
          .attr("r", r)
          .attr("stroke", "black")
          .attr("stroke-width", 2)
          .attr("fill", d => {
            // prefer backend-provided balance, fallback to frontend-computed
            let b = (d.data.balance !== undefined) ? d.data.balance : d.balance;
            if (b > 1) {
              return "blue";       // left-heavy
            } else if (b < -1) {
              return "crimson";    // right-heavy
            } else {
              return "steelblue";  // balanced
            }
          })  

      node.exit().transition().duration(500).attr("r", 0).remove();

      // NODE LABELS
      let label = g.selectAll("text.node-label")
          .data(nodes, d => d.data.name);   // changed id to name

      label.enter().append("text")
            .attr("class", "node-label")
            .attr("text-anchor", "middle")
            .attr("fill", "white")
            .style("opacity", 0)
            .style("pointer-events", "none")   // <-- important
          .merge(label)
            .attr("x", d => d.x)
            .attr("y", d => d.y + 5)
            .text(d => d.data.name)
            .style("opacity", 1);

      label.exit().remove();


      let balanceLabel = g.selectAll("text.balance-label")
          .data(nodes, d => d.data.name);

      balanceLabel.enter().append("text")
            .attr("class", "balance-label")
            .attr("text-anchor", "start")
            .attr("fill", "black")
            .style("pointer-events", "none")
          .merge(balanceLabel)
            .attr("x", d => d.x + 20)   // offset to the right of circle
            .attr("y", d => d.y + 5)
            .text(d => d.data.balance);

      balanceLabel.exit().remove();

   } 

   function insertNode() {
     // svg.selectAll("text.empty-placeholder").remove();
      hideEmptyTree();

     let input = document.getElementById("inputValue");
     let val = input.value;

     fetch("/insert", {
       method: "POST",
       headers: {"Content-Type": "application/json"},
       body: JSON.stringify({key: val})
     })
     .then(res => res.json())
     .then(data => {
       if (data === null) {
         msg = `Limit reached - ${val} not inserted`
         showStatus(msg, "red");
         input.value = "";   // ✅ clear field, placeholder shows again
       } else {
         render(data);
         msg = `Node ${val} inserted successfully - click to update traversal list`
         showStatus(msg, "green");
         input.value = "";   // ✅ clear field, placeholder shows again
       }
     });
   }


   function clearTree() {
      // Select the dedicated tree group
       let gTree = svg.select("g.tree");
       gTree.selectAll("*").remove();

       // Remove all children, display empty tree message 
       showEmptyTree();  
   }


   function deleteNode() {
     let input = document.getElementById("inputValue")
     let val = input.value;
     if (!val) {
       showStatus("Please enter a value to delete", "red");
       return;
     }

     fetch("/delete", {
       method: "POST",
       headers: {"Content-Type": "application/json"},
       body: JSON.stringify({key: val})
     })
     .then(res => res.json())
     .then(data => {
       if (data === null) {
            msg = `Deletion unsuccessful - node ${val} not found`
            showStatus(msg, "red");
            input.value = "";   // Clear field, placeholder shows again
       } else if (data.empty) {

         clearTree();
         
         showStatus("Tree is now empty", "blue");
       } else {
         render(data);
         msg = `Node ${val} deleted successfully - click to update traversal list`
         showStatus(msg, "green");
         input.value = "";   // Clear field, placeholder shows again
       }
     });
   }

   function initialize_and_cleanup() {
       loadOrResetTree();
   }

   function loadOrResetTree(endpoint = "/tree", method = "GET") {
     fetch(endpoint, {
       method: method,
       headers: { "Content-Type": "application/json" }
     })
       .then(res => res.json())
       .then(data => {

         //svg.selectAll("g.intro-box").remove();


         // Clear the visualization group first
