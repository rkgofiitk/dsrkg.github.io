<style>
.section { display: none; }
button { margin: 10px; }
.nav-buttons {
  text-align: right;
  margin: 10px 0;
}
.nav-buttons button {
  margin-left: 5px;
}
</style>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\

\[', '\\]

']]
    },
    chtml: { scale: 1.0 }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>


<script>
document.addEventListener("DOMContentLoaded", () => {
  const sections = document.querySelectorAll(".section");
  let current = 0;  // start at first section

  function show(n) {
    sections.forEach((el, i) => {
      el.style.display = (i === n) ? "block" : "none";
    });
    // optional: disable buttons at ends
    document.querySelector("button[onclick='prev()']").disabled = (n === 0);
    document.querySelector("button[onclick='next()']").disabled = (n === sections.length - 1);
  }

  window.next = function() {
    if (current < sections.length - 1) {
      current++;
      show(current);
    }
  };

  window.prev = function() {
    if (current > 0) {
      current--;
      show(current);
    }
  };

  // show the first section initially
  show(current);
});
</script>
